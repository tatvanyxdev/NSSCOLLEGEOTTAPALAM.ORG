<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <title>NSS College Ottapalam - Loading Portal...</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script>
      // Single Page Application redirect script for GitHub Pages
      // Mitigates 404 errors when refreshing on deep routes
      (function() {
        var pathSegmentsToKeep = 1; // 1 segment for https://<username>.github.io/<repo-name>/
        var l = window.location;
        
        // Check if hosted on custom domain (root level) vs github.io subfolder
        if (l.hostname.indexOf('github.io') === -1) {
          pathSegmentsToKeep = 0;
        }

        var newUrl = l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
          l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?p=/' +
          l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
          (l.search ? '&q=' + l.search.slice(1).replace(/&/g, '~and~') : '') +
          l.hash;

        l.replace(newUrl);
      })();
    </script>
    <style>
      body {
        margin: 0;
        padding: 0;
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        align-items: center;
        justify-content: center;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        background: #0f172a;
        color: #f8fafc;
      }
      .loader {
        width: 48px;
        height: 48px;
        border: 4px solid #1e293b;
        border-top-color: #3b82f6;
        border-radius: 50%;
        animation: spin 0.8s linear infinite;
        margin-bottom: 16px;
      }
      @keyframes spin {
        to { transform: rotate(360deg); }
      }
      h1 { font-size: 1.1rem; font-weight: 600; margin: 0 0 8px 0; }
      p { font-size: 0.875rem; color: #94a3b8; margin: 0; }
    </style>
  </head>
  <body>
    <div class="loader"></div>
    <h1>NSS College Ottapalam ERP</h1>
    <p>Loading application route...</p>
  </body>
</html>
